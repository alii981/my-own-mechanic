<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Want to Be My Own Mechanic!</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="top">
  <span class="brand" id="brand">My Own Mechanic</span>
  <span class="lvl" id="lvlName"></span>
  <span class="score" id="scoreBox"></span>
  <button class="small" id="btnSound">🔊</button>
  <button class="small" id="btnLang">EN</button>
  <button class="small" id="btnMenu">Meniu</button>
</div>
<div class="screen on" id="menu"><div class="wrap" id="menuWrap"></div></div>
<div class="screen" id="road">
  <canvas id="roadCanvas"></canvas>
  <div id="dash">
    <svg id="icBat" viewBox="0 0 30 24"><rect x="3" y="6" width="24" height="15" rx="2" fill="none" stroke="#e5534b" stroke-width="2"/><rect x="7" y="3" width="4" height="3" fill="#e5534b"/><rect x="19" y="3" width="4" height="3" fill="#e5534b"/><path d="M8 13h5M20 13h5M22.5 10.5v5" stroke="#e5534b" stroke-width="2"/></svg>
    <svg id="icOil" viewBox="0 0 30 24"><path d="M4 12h6l3-3h8l5 3-5 6H9l-5-3z" fill="none" stroke="#e5534b" stroke-width="2" stroke-linejoin="round"/><path d="M26 8c1 2 1 3 0 4" stroke="#e5534b" stroke-width="2" fill="none"/></svg>
    <svg id="icTemp" viewBox="0 0 30 24"><path d="M15 3v12" stroke="#e5534b" stroke-width="2.5"/><circle cx="15" cy="17" r="3.5" fill="#e5534b"/><path d="M17 6h4M17 10h4M5 21c3-2 5 2 8 0s5 2 8 0 5 2 6 0" stroke="#e5534b" stroke-width="1.6" fill="none"/></svg>
    <svg id="icEng" viewBox="0 0 30 24"><path d="M5 9h4V6h9v3h3l3-3h3v13h-3l-3-3h-2v4H9v-4H5z" fill="none" stroke="#f0a020" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg id="icGlow" viewBox="0 0 30 24"><path d="M6 12c0-4 3-4 3 0s3 4 3 0 3-4 3 0 3 4 3 0 3-4 3 0 3 4 3 0" fill="none" stroke="#f0a020" stroke-width="2"/></svg>
    <span class="rpm" id="rpmTxt">0 rpm</span>
  </div>
  <div id="story"><div class="txt" id="storyTxt"></div><div class="btns" id="storyBtns"></div></div>
</div>
<div class="screen" id="garage">
  <canvas id="c3d"></canvas>
  <div id="tools"></div>
  <div id="readout"></div>
  <div id="viewbar"></div>
  <div id="lesson"><div class="n" id="lsN"></div><div class="t" id="lsT"></div><div id="lsB"></div><div class="btns" id="lsBtns"></div></div>
  <div id="tip"></div>
  <div id="warn"></div>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="fallback"><div id="fallbackTxt">Se încarcă…</div></div>
<script>
window.__booted=false;
setTimeout(function(){ if(!window.__booted){ var f=document.getElementById('fallback'); f.style.display='flex'; document.getElementById('fallbackTxt').innerHTML='Grafica 3D nu s-a putut încărca (Three.js de pe cdn.jsdelivr.net).<br>Verifică conexiunea și reîncarcă pagina.<br><br>The 3D library could not load. Check your connection and reload.'; } }, 10000);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
