<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Want to Be My Own Mechanic!</title>
<style>

:root{--bg:#14171b;--panel:#1d2228;--panel2:#252b33;--line:#343c46;--ink:#e8ecf1;--quiet:#9aa5b1;--accent:#f0a020;--good:#3fb37f;--bad:#e5534b;--blue:#4c8dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
button.small{padding:5px 9px;font-size:13px}
#top{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#101317;border-bottom:1px solid var(--line);z-index:20}
#top .brand{font-weight:700;letter-spacing:.3px}
#top .lvl{color:var(--quiet);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .score{font-weight:600;color:var(--accent);font-size:14px}
.screen{position:fixed;top:48px;left:0;right:0;bottom:0;display:none}
.screen.on{display:block}
/* menu */
#menu{overflow:auto}
#menu .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
#menu h1{font-size:28px;margin:0 0 4px}
#menu .sub{color:var(--quiet);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 10px;color:var(--quiet);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--panel2);color:var(--quiet);margin-right:6px}
/* road */
#roadCanvas{position:absolute;inset:0;width:100%;height:100%}
#story{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:min(640px,94vw);background:rgba(16,19,23,.92);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#story .txt{min-height:44px;margin-bottom:10px}
#story .btns{display:flex;gap:8px;flex-wrap:wrap}
#dash{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(10,12,15,.85);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
#dash svg{width:30px;height:24px;opacity:.18;transition:opacity .2s}
#dash svg.on{opacity:1}
#dash .rpm{font-variant-numeric:tabular-nums;color:var(--quiet);font-size:13px;min-width:86px;text-align:right}
/* garage */
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tools{position:absolute;top:10px;left:10px;width:236px;max-height:calc(100% - 20px);overflow:auto;background:rgba(20,23,27,.94);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
#tools h4{margin:6px 2px 2px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--quiet)}
#tools .row{display:flex;gap:6px;flex-wrap:wrap}
#tools .row button{flex:1}
#status{font-size:13px;color:var(--quiet);padding:2px 2px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
#status b{color:var(--ink);font-weight:600}
#readout{position:absolute;top:10px;right:10px;width:330px;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:8px}
.ro{background:rgba(20,23,27,.95);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.ro .h{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.ro .h small{color:var(--quiet);font-weight:400}
.ro table{width:100%;border-collapse:collapse;font-size:13px}
.ro td{padding:2px 0;border-bottom:1px solid #2a3139}
.ro td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ro.think{border-color:#5b4a8a;background:rgba(30,26,44,.95)}.ro.think .h{color:#b9a8f0}
.ro.good{border-color:#2f6b52}.ro.bad{border-color:#7a3531}.ro.hint{border-color:#80621f}
.ro .q{color:var(--quiet)}
#tip{position:absolute;pointer-events:none;background:#0d1013;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;display:none;z-index:5}
#viewbar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(20,23,27,.9);border:1px solid var(--line);border-radius:10px;padding:5px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
#modal h2{margin:0 0 8px;font-size:20px}
#modal p{margin:0 0 10px}
#modal .opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
#modal .opts button.sel{border-color:var(--accent);background:#3a2f1a}
#modal .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
#modal .sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--quiet);margin:14px 0 4px}
#lesson{position:absolute;top:10px;left:10px;width:340px;max-height:calc(100% - 76px);overflow:auto;background:rgba(16,19,23,.95);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}
#lesson .n{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
#lesson .t{font-weight:600;margin-bottom:4px}
#lesson .btns{display:flex;gap:8px;justify-content:space-between;margin-top:10px;position:sticky;bottom:-12px;background:rgba(16,19,23,.98);padding:8px 0}
#fallback{position:fixed;inset:48px 0 0 0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--quiet);z-index:30;background:var(--bg)}
@media (max-width:760px){
 #lesson{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46%;border-radius:12px 12px 0 0}
 #tools{top:auto;bottom:0;left:0;right:0;width:auto;max-height:42%;border-radius:12px 12px 0 0}
 #readout{top:6px;right:6px;left:6px;width:auto;max-height:36%}
 #viewbar{bottom:auto;top:calc(36% + 14px);left:auto;right:8px;transform:none;flex-direction:column}
 #lesson{position:absolute;top:10px;left:10px;width:340px;max-height:calc(100% - 76px);overflow:auto;background:rgba(16,19,23,.95);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}
}

#lesson p{margin:0 0 8px;font-size:14px}
#lesson .focus{font-size:13px;color:#ffb35c;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.card.car.off{opacity:.55}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tag.you{background:#3a2f1a;color:#f0b44a}
.sec{text-transform:uppercase;font-size:12px;letter-spacing:.6px;color:var(--quiet);margin:0 0 8px}
.ro .sub2{font-weight:600;font-size:13px;margin:6px 0 2px}
.ro.find{border-color:#2f5f7a}
ul.src{margin:0 0 8px;padding-left:18px;font-size:13px}
ul.src a{color:#8fb8ff}

#warn{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:min(560px,60vw);background:rgba(90,58,10,.96);border:1px solid #f0a020;border-radius:12px;padding:8px 12px;font-size:14px;z-index:6}
#warn.on{display:flex}
#warn b{color:#ffd27a}
@media (max-width:760px){ #warn{top:auto;bottom:calc(42% + 8px);max-width:94vw} }

</style>

  road: [['scene', { snow: true, sky: 'cold' }], ['say', T('−10 °C, ora 7. Mașina a stat afară toată noaptea.', '−10 °C, 7 a.m. The car sat out all night.')], ['btn', T('Răsucește cheia', 'Turn the key')], ['dash', { glow: true }], ['wait', 1400], ['dash', { glow: false }], ['crank', 'slow'], ['say', T('Demarorul a tras greu, rar… motorul nu a prins.', 'The starter turned slowly… it didn\'t catch.')], ['btn', T('Mai încearcă o dată', 'Try again')], ['crank', 'chatter'], ['dash', { bat: true, eng: true }], ['wait', 1700], ['dash', { bat: false, eng: false }], ['say', T('Doar clic-clic-clic. Acum bordul abia se mai aprinde.', 'Just click-click-click. Now the dash barely lights.')], ['btn', 'toGarage']],
  obs: ob({ battery: T('Eticheta arată că bateria are 6 ani. Bornele sunt strânse, fără oxid.', 'The label shows the battery is 6 years old. Terminals tight, no corrosion.') }),
  cands: ['battery', 'alternator', 'solenoid', 'starter', 'groundStrap', 'glow'], correct: ['battery'],
  hints: [T('Înainte să bănuiești demarorul, află dacă primește destul curent. Ce tensiune are bateria în repaus?', 'Before blaming the starter, check it gets enough current. What does the battery read at rest?'), T('O baterie poate arăta bine după încărcare și totuși să cedeze sub sarcină la frig. Ce zice testerul de baterie?', 'A battery can look fine after charging and still collapse under load in the cold. What does the tester say?'), T('Dacă pornește cu booster, verifică și încărcarea.', 'If it starts with a jump pack, check charging too.')],
  explain: T('Bateria era uzată (SOH aprox. 35%). La −10 °C chimia ei e mai lentă și rezistența internă crește, iar uleiul rece face motorul greu de rotit. Tensiunea a căzut sub pragul la care solenoidul ține contactele, de aici clic-clic. Încărcarea nu reface o baterie uzată. Alternatorul era bun (aprox. 14,3 V).', 'The battery was worn (SOH about 35%). At −10 °C its chemistry slows and internal resistance rises, while cold oil makes the engine hard to turn. Voltage fell below what the solenoid needs, hence clicking. Charging can\'t restore a worn battery. The alternator was fine (about 14.3 V).'),
  home: T('Multimetru pe baterie după câteva ore de stat: 12,6 V plină, sub 12,2 V descărcată. La schimb: întâi borna −, apoi +, apoi brida; la montare invers, − ultima.', 'Multimeter after the car has sat for hours: 12.6 V full, under 12.2 V flat. Swap: − first, then +, then clamp; refit in reverse, − last.'),
  test: 'frost' },

  cands: ['battery', 'alternator', 'belt', 'solenoid', 'groundStrap', 'altConn'], correct: ['alternator'],
  hints: [T('Martorul bateriei se aprinde când sistemul nu se încarcă, nu neapărat când bateria e proastă.', 'The battery light means the system isn\'t charging, not necessarily a bad battery.'), T('Măsoară bateria cu motorul pornit.', 'Measure the battery with the engine running.'), T('Înainte să condamni piesa care încarcă, uită-te la ce o antrenează.', 'Before condemning the part that charges, look at what drives it.')],
  explain: T('Alternatorul nu mai încărca (de obicei regulatorul, periile sau diodele). Cu motorul pornit bateria avea aprox. 12,3 V în loc de aprox. 14 V, deci mașina a mers pe baterie până a golit-o.', 'The alternator stopped charging (usually regulator, brushes or diodes). Running, the battery read about 12.3 V instead of about 14 V, so the car ran on the battery until it was flat.'),
  home: T('Multimetru pe baterie la ralanti cu faruri și ventilator pornite: 13,8–14,5 V e normal. Fă o poză traseului curelei înainte s-o scoți.', 'Battery at idle with lights and blower on: 13.8–14.5 V is normal. Photograph the belt routing first.'),

{ id: 'k_sol', sys: 'electric', diff: 3, conf: 'B', src: [], user: true,
  title: T('Clicul de la benzinărie', 'The click at the gas station'), blurb: T('Baterie nouă, demaror recondiționat cu solenoidul vechi. Rece pornește, cald doar clic. (Cazul tău.)', 'New battery, rebuilt starter with the old solenoid. Starts cold, only clicks hot. (Your case.)'),

  obs: ob({ battery: T('Baterie nouă, montată acum o lună.', 'New battery, fitted a month ago.'), starter: T('Corpul demarorului e curat, cu eticheta atelierului. Solenoidul de deasupra e vechi și murdar.', 'The starter body is clean with the shop\'s label. The solenoid on top is old and dirty.'), solenoid: T('Carcasa e caldă la atingere după drum.', 'Housing warm to the touch after the drive.') }),
  cands: ['battery', 'alternator', 'solenoid', 'starter', 'groundStrap', 'starterConn'], correct: ['solenoid', 'starter'], partial: { starter: { pts: 10, txt: T('Ai schimbat tot demarorul; era suficient solenoidul (−10).', 'You replaced the whole starter; the solenoid would have done (−10).') } },
  hints: [T('Bateria e nouă și o poți verifica. Dacă sursa e bună, unde se pierde comanda?', 'The battery is new and checkable. If the source is good, where does the command get lost?'), T('Pornirea are două trepte: un curent mic spre solenoid și unul mare pe care solenoidul îl lasă să treacă. Măsoară înainte și după.', 'Starting has two stages: a small current to the solenoid and a big one it lets through. Measure before and after.'), T('Ce s-a schimbat între dimineață și acum? Lasă mașina să stea.', 'What changed since this morning? Let the car sit.')],
  explain: T('Solenoidul împinge pinionul în coroana volantului și închide contactele groase spre demaror. Uzat, cedează la cald: metalul se dilată, rezistența crește. Semnul clar: tensiune pe borna S, 0 V la ieșire. Solenoidul face parte din demaror; alternatorul are regulator, nu solenoid.', 'The solenoid pushes the pinion into the ring gear and closes the heavy contacts to the starter. Worn, it fails hot as metal expands. Giveaway: voltage on S, 0 V at the output. The solenoid is part of the starter; the alternator has a regulator, not a solenoid.'),
  home: T('Cu un ajutor pe cheie, măsori pe borna S și pe ieșire: 12 V pe S și 0 V la ieșire = solenoid. Întâi borna − a bateriei.', 'With a helper on the key, measure S and the output: 12 V on S, 0 V out = solenoid. Battery − off first.'),
  test: 'sol' },

  cands: ['glow', 'injectors', 'battery', 'fuelFilter', 'starter', 'ckp'], correct: ['glow'],
  hints: [T('Problema apare doar la rece. Ce ajută un diesel să pornească la rece?', 'It only happens cold. What helps a diesel start cold?'), T('Fumul alb la rece înseamnă motorină care nu arde complet: camera de ardere e prea rece.', 'White smoke when cold means fuel isn\'t burning fully: the chamber is too cold.'), T('Codurile numesc doi cilindri. Ce piesă are fiecare cilindru, alimentată electric la pornire?', 'The codes name two cylinders. What part does each cylinder have, powered at start-up?')],
  explain: T('Două bujii incandescente erau arse. La rece, cilindrii respectivi nu s-au încălzit destul: motorina nu ardea complet, de unde fum alb, scuturături și pornire lungă. La cald, aerul comprimat e oricum fierbinte, deci problema dispare.', 'Two glow plugs had failed. Cold, those cylinders didn\'t heat enough: fuel didn\'t burn fully, hence white smoke, shaking and a long crank. Warm, compressed air is hot anyway, so the problem vanishes.'),
  home: T('Bujiile se verifică cu multimetrul pe rezistență (sub câțiva ohmi = bune, infinit = arse) sau cu un clește ampermetric. Scoate-le doar cu motorul rece: se pot rupe în chiulasă.', 'Check plugs with a multimeter on resistance (a few ohms = good, open = failed) or a clamp meter. Only remove them cold: they can snap in the head.'),

  hints: [T('Demarorul învârte bine, deci partea electrică de pornire e în regulă. Ce îi trebuie calculatorului ca să înceapă să injecteze?', 'The starter turns fine, so starting electrics are OK. What does the ECU need before it injects?'), T('Turometrul nu mișcă deloc în timpul pornirii. De unde își ia el semnalul?', 'The rev counter doesn\'t move while cranking. Where does it get its signal?'), T('La rece merge, la cald nu. Unele piese electronice cedează când se încălzesc.', 'Works cold, not hot. Some electronic parts fail when heated.')],

  hints: [T('Bateria și demarorul fac treaba, dar motorul nu prinde. Ajunge motorina până la injectoare?', 'Battery and starter do their job, yet no catch. Is fuel reaching the injectors?'), T('Presiunea din rampă e mult sub cea cerută. Ce poate opri motorina înainte de pompa de înaltă presiune?', 'Rail pressure is far below target. What could block fuel before the high-pressure pump?'), T('Motorina de vară se îngroașă la ger.', 'Summer diesel thickens in frost.')],

  hints: [T('Rece merge, cald nu. Bateria și demarorul învârt bine, deci problema e la motorină.', 'Cold OK, hot not. Battery and starter turn fine, so it\'s fuel.'), T('Calculatorul nu injectează până nu vede presiune destulă în rampă. Unde se poate pierde presiunea?', 'The ECU won\'t inject until rail pressure is high enough. Where can pressure leak away?'), T('Există un test simplu care măsoară câtă motorină se întoarce de la fiecare injector.', 'There\'s a simple test measuring how much fuel each injector returns.')],
  explain: T('Injectorul 3 avea supapa de comandă uzată. La cald, motorina e mai fluidă și piesele dilatate lasă mai multă să scape pe retur. La pornire pompa nu reușea să ridice repede presiunea în rampă, iar calculatorul nu injecta până nu atingea pragul.', 'Injector 3 had a worn control valve. Hot, fuel is thinner and expanded parts leak more to the return. At start the pump couldn\'t build rail pressure fast enough, and the ECU wouldn\'t inject until it reached the threshold.'),
  home: T('Testul de retur: scoți furtunurile de retur, pui eprubete sau sticle mici și compari după un minut de ralanti. Înlocuirea cere garnituri noi și codarea injectorului cu tester.', 'Back-leak test: detach the return hoses, fit small bottles and compare after a minute at idle. Replacement needs new seals and coding with a scanner.'),
  fixed: T('Oprită caldă 10 minute, pornește din prima.', 'Stopped hot for 10 minutes, it restarts first time.'), still: T('La cald tot învârte mult.', 'Hot, it still cranks for ages.') },
{ id: 'k_oilpump', sys: 'engine', diff: 2, conf: 'B', src: ['fiches'],
  title: T('Martorul de ulei clipește', 'Oil light flickers'), blurb: T('Cald, la ralanti, martorul roșu de ulei clipește. Se aude un țăcănit din chiulasă.', 'Hot at idle, the red oil light flickers. Ticking from the head.'),
  sim: { ambient: 20, engT: 20 }, garage: { engT: 90 },

  oil: T('Nivelul e la MAX, uleiul schimbat acum 5.000 km. Manometrul montat în locul senzorului: la ralanti cald aprox. 0,5 bar (prea puțin), la 3.000 rpm aprox. 1,5 bar.', 'Level at MAX, oil changed 5,000 km ago. Gauge fitted in place of the switch: hot idle about 0.5 bar (too low), 3,000 rpm about 1.5 bar.'),
  listen: T('Țăcănit metalic din zona axelor cu came, mai tare la cald.', 'Metallic ticking from the camshaft area, louder when hot.'), listenSfx: 'tick',
  obs: ob({ oil: T('Nivel corect, ulei curat.', 'Level correct, oil clean.'), oilSwitch: T('Mufa e prinsă, fără ulei pe ea.', 'Plug on, no oil on it.') }),
  cands: ['oilPump', 'oilSwitch', 'oilPan', 'turbo', 'injectors', 'engineMount'], correct: ['oilPump'],
  hints: [T('Martorul poate minți, dar și țăcănitul? Verifică presiunea cu un instrument independent.', 'The light can lie, but the ticking too? Check pressure with an independent gauge.'), T('Nivelul e bun. Atunci cine face presiunea?', 'The level is fine. So what makes the pressure?'), T('Pe acest motor e cunoscut un defect la una dintre piesele circuitului de ungere.', 'This engine has a known fault in one lubrication part.')],
  explain: T('Pe M9R-ul de 150 CP e raportat un defect de pompă de ulei care a distrus multe motoare. Presiunea reală măsurată cu manometrul era prea mică, deci senzorul spunea adevărul. Ai oprit la timp: mersul mai departe ar fi topit cuzineții.', 'The 150 hp M9R has a reported oil-pump fault that destroyed many engines. Real pressure on the gauge was too low, so the switch was telling the truth. You stopped in time: carrying on would have spun the bearings.'),
  home: T('Martor roșu de ulei = oprești imediat motorul și verifici nivelul. Un manometru mecanic în locul senzorului îți spune presiunea reală.', 'Red oil light = stop the engine immediately and check the level. A mechanical gauge in place of the switch gives the real pressure.'),
  fixed: T('Manometrul arată presiune bună la cald, martorul nu mai clipește, țăcănitul a dispărut.', 'Gauge reads good pressure hot, the light no longer flickers, ticking gone.'), still: T('La ralanti cald martorul clipește din nou.', 'At hot idle the light flickers again.') },

  listen: T('Turbo-ul sună normal; șuieratul vine de jos, din dreapta.', 'The turbo sounds normal; the hiss comes from low on the right.'), listenSfx: 'hiss',
  obs: ob({ icHose: T('Furtunul de cauciuc e lucios de ulei; are o crăpătură.', 'The rubber hose is shiny with oil; it has a split.'), turbo: T('Paletele compresorului sunt intacte, fără joc.', 'Compressor blades intact, no play.') }),
  cands: ['icHose', 'turbo', 'boostSol', 'mapSensor', 'maf', 'egr'], correct: ['icHose'],
  hints: [T('Șuieratul înseamnă aer care scapă. Unde e aerul sub presiune?', 'A hiss means escaping air. Where is the air under pressure?'), T('Turbo-ul face presiune, dar ea nu ajunge în motor. Între ele sunt conducte.', 'The turbo makes boost, but it doesn\'t reach the engine. There are pipes in between.'), T('Un test cu fum arată imediat o scurgere.', 'A smoke test shows a leak at once.')],
  explain: T('Furtunul de cauciuc dintre turbo și intercooler era fisurat. Aerul comprimat scăpa, presiunea reală rămânea mult sub cea cerută, iar calculatorul punea motorul în mod de avarie. Fumul negru vine din motorina care nu are destul aer să ardă.', 'The rubber hose between turbo and intercooler was split. Boost escaped, actual pressure stayed far below target, and the ECU went into limp mode. Black smoke is fuel without enough air to burn.'),
  home: T('Verifică furtunurile de intercooler cu mâna: fisurile se deschid când le îndoi. Un strat de ulei pe furtun e normal până la o limită; uleiul înmoaie cauciucul în timp.', 'Feel the intercooler hoses: splits open when you flex them. Some oil film is normal; oil softens rubber over time.'),
  fixed: T('Trage normal, fără șuierat, presiunea turbo ajunge la cea cerută.', 'Pulls normally, no hiss, boost reaches target.'), still: T('Tot șuieră și nu trage.', 'Still hisses and won\'t pull.') },

  drive: { txt: T('Pe urcare intră în avarie: nu trece de 2.500 rpm.', 'Uphill it goes into limp mode: stuck below 2,500 rpm.') },

  obs: ob({ turbo: T('Tija actuatorului se mișcă greu și nu face cursa completă când aplici vacuum cu pompa de mână.', 'The actuator rod moves stiffly and doesn\'t complete its travel when you apply vacuum with a hand pump.'), boostSol: T('Electrovalva clicăie când e comandată din tester.', 'The solenoid clicks when commanded from the scanner.'), icHose: T('Furtunurile sunt în regulă.', 'Hoses are fine.') }),
  cands: ['turbo', 'boostSol', 'icHose', 'mapSensor', 'maf', 'egr'], correct: ['turbo'],
  hints: [T('Presiunea reală nu ajunge la cea cerută, dar nu e nicio scurgere.', 'Actual boost falls short, but there\'s no leak.'), T('Electrovalva răspunde la comandă. Ce urmează după ea?', 'The solenoid responds to commands. What comes after it?'), T('Mersul prin oraș încarcă de funingine piesele mobile ale turbo-ului.', 'City driving coats the turbo\'s moving parts with soot.')],
  explain: T('Paletele turbo-ului cu geometrie variabilă s-au blocat parțial din cauza funinginii, tipic pentru mers prin oraș. Turbo-ul nu mai putea face presiunea cerută la sarcină mare, iar calculatorul trecea în mod de avarie.', 'The variable-geometry vanes partly seized with soot, typical of city driving. The turbo couldn\'t reach target boost under heavy load, and the ECU went into limp mode.'),
  home: T('Cu o pompă de vacuum de mână pe actuator, tija trebuie să se miște lin pe toată cursa. Drumurile lungi, la turații medii, ajută turbo-ul să se curețe.', 'With a hand vacuum pump on the actuator, the rod should move smoothly through its full travel. Long drives at medium revs help keep the turbo clean.'),
  fixed: T('Pe aceeași urcare trage normal, fără avarie.', 'Same hill, pulls normally, no limp mode.'), still: T('Pe urcare intră din nou în avarie.', 'Uphill it goes into limp mode again.') },

  title: T('Avarie și nu repornește', 'Limp mode, won\'t restart'), blurb: T('Intră în avarie cu „Verificați injecția”. Uneori, după oprire, refuză să pornească până ștergi codurile.', 'Limp mode with "Check injection". Sometimes after stopping it won\'t restart until codes are cleared.'),

  obs: ob({ boostSol: T('Comandată din tester, electrovalva clicăie, dar vacuumul măsurat la ieșire rămâne aproape zero.', 'Commanded from the scanner, the solenoid clicks, but vacuum at its outlet stays near zero.'), turbo: T('Cu pompa de vacuum de mână, tija actuatorului se mișcă lin pe toată cursa.', 'With a hand vacuum pump the actuator rod moves smoothly through full travel.') }),
  cands: ['boostSol', 'turbo', 'mapSensor', 'icHose', 'maf', 'egr'], correct: ['boostSol'],
  hints: [T('Turbo-ul cu geometrie variabilă e comandat pneumatic. Cine îi dă vacuumul?', 'The variable turbo is controlled pneumatically. What supplies its vacuum?'), T('Testează separat turbo-ul (cu pompă de mână) și piesa care îl comandă.', 'Test the turbo separately (with a hand pump) and the part that controls it.'), T('Clicul electric nu înseamnă că piesa și lasă vacuumul să treacă.', 'An electrical click doesn\'t mean the part lets vacuum through.')],
  explain: T('Electrovalva de comandă a turbo-ului primea semnal și clicăia, dar nu mai lăsa vacuumul spre actuator. Turbo-ul era bun (tija se mișca lin cu pompa de mână). Pe un Koleos 2.0 dCi 150, înlocuirea acestei electrovalve a rezolvat exact problema.', 'The turbo control solenoid got its signal and clicked but no longer passed vacuum to the actuator. The turbo was fine (rod moved freely with a hand pump). On a Koleos 2.0 dCi 150, replacing this solenoid fixed exactly this.'),
  home: T('Testezi cu o pompă de vacuum de mână: la actuator, apoi la ieșirea electrovalvei cu ea comandată. Verifică și furtunașele de vacuum, se crapă cu vârsta.', 'Test with a hand vacuum pump: at the actuator, then at the solenoid outlet while commanded. Check the small vacuum hoses too; they crack with age.'),
  fixed: T('3.000 km fără avarie, pornește normal.', '3,000 km without limp mode, starts normally.'), still: T('Intră din nou în avarie.', 'Limp mode again.') },

  obs: ob({ mapSensor: T('Mufa are pinii ușor oxidați.', 'The plug has slightly corroded pins.'), turbo: T('Actuatorul se mișcă lin.', 'Actuator moves freely.'), boostSol: T('Vacuumul trece normal când e comandată.', 'Vacuum passes normally when commanded.') }),
  cands: ['mapSensor', 'turbo', 'boostSol', 'icHose', 'maf', 'egr'], correct: ['mapSensor'],
  hints: [T('Presiunea „reală” din tester sare mai repede decât poate turbo-ul fizic.', 'The "actual" boost on the scanner jumps faster than a turbo physically can.'), T('Cine raportează această valoare calculatorului?', 'What reports that value to the ECU?'), T('Un senzor greșit poate face calculatorul să reducă degeaba presiunea.', 'A bad sensor can make the ECU cut boost for nothing.')],
  explain: T('Senzorul de presiune turbo raporta valori nerealiste. Calculatorul credea uneori că presiunea e prea mare sau prea mică și reducea puterea. Pe Koleos 2.0 dCi e raportat ca defect la aprox. 105.000 km, iar pe același motor la Espace înlocuirea lui a rezolvat lipsa de putere.', 'The boost pressure sensor reported implausible values. The ECU sometimes thought boost was too high or low and cut power. Reported failing on a Koleos 2.0 dCi at about 105,000 km, and on the same engine in an Espace replacing it fixed the power loss.'),
  home: T('Înainte de a cumpăra senzor: curăță mufa și verifică firele. Valoarea cu motorul oprit trebuie să fie aproape de presiunea atmosferică (aprox. 1.000 mbar).', 'Before buying a sensor: clean the plug and check the wires. With the engine off it should read close to atmospheric (about 1,000 mbar).'),
  fixed: T('Putere constantă, martorul nu mai apare.', 'Steady power, no more engine light.'), still: T('Puterea tot vine și pleacă.', 'Power still comes and goes.') },

  road: [['scene', { sky: 'day' }], ['btn', T('Pornește la drum', 'Set off')], ['start', 'start'], ['drive', 60, 1700], ['wait', 2500], ['smoke', 'black'], ['say', T('La accelerare mașina e leneșă și scoate un nor de fum negru. Turbo-ul fluieră normal.', 'Accelerating, it\'s sluggish and puffs black smoke. The turbo whistles normally.')], ['wait', 2500], ['smoke', null], ['btn', 'toGarage'], ['park']],
  drive: { txt: T('Leneșă jos, fum negru la accelerare.', 'Sluggish low down, black smoke when accelerating.'), smoke: 'black' },
  smoke: T('Nicio scurgere.', 'No leaks.'),
  obs: ob({ maf: T('Firul senzorului din interior e acoperit de un strat gri de praf și ulei.', 'The sensing wire inside is coated with grey dust and oil.'), airbox: T('Filtrul de aer e murdar, schimbat acum 40.000 km.', 'The air filter is dirty, changed 40,000 km ago.') }),
  cands: ['maf', 'mapSensor', 'turbo', 'egr', 'icHose', 'airbox'], correct: ['maf'],
  hints: [T('Presiunea turbo e bună, dar debitul de aer măsurat e mult sub cel așteptat.', 'Boost is fine, but measured air flow is far below expected.'), T('Dacă aerul ajunge, poate doar nu e măsurat corect.', 'If the air arrives, maybe it just isn\'t measured correctly.'), T('Uită-te la piesa dintre filtru și turbo.', 'Look at the part between the filter and the turbo.')],
  explain: T('Debitmetrul era murdar și raporta mai puțin aer decât intra. Calculatorul a crezut că nu e aer destul și a redus cantitatea de motorină sau EGR-ul a fost comandat greșit; rezultatul: lene și fum. Filtrul de aer vechi a ajutat la murdărire.', 'The air-flow meter was dirty and under-read. The ECU thought air was short and trimmed fuel or mis-commanded the EGR; result: sluggishness and smoke. The old air filter helped dirty it.'),
  home: T('Unii curăță debitmetrul cu spray special pentru MAF (nu cu altceva și fără să atingi firul). Schimbă filtrul de aer la interval.', 'Some clean the MAF with dedicated MAF spray (nothing else, don\'t touch the wire). Change the air filter on schedule.'),
  fixed: T('Trage curat de jos, fără fum.', 'Pulls cleanly from low revs, no smoke.'), still: T('Tot leneșă și afumată.', 'Still sluggish and smoky.') },

  obs: ob({ egr: T('Supapa e plină de calamină neagră și lipicioasă; clapeta rămâne întredeschisă.', 'The valve is caked with sticky black soot; the flap stays part-open.') }),
  cands: ['egr', 'maf', 'injectors', 'turbo', 'mapSensor', 'glow'], correct: ['egr'],
  hints: [T('Calculatorul cere o poziție, piesa raportează alta.', 'The ECU asks for one position, the part reports another.'), T('Când o supapă rămâne deschisă, gazele arse înlocuiesc aerul curat.', 'When a valve stays open, exhaust replaces fresh air.'), T('Curentul de aer măsurat scade fiindcă intră gaze pe altă cale.', 'Measured air flow drops because exhaust comes in another way.')],
  explain: T('Supapa EGR era blocată întredeschisă cu calamină. Gazele de evacuare intrau permanent în admisie, înlocuind aerul curat: ralanti neregulat, fum, ezitări. După înlocuire, poziția trebuie învățată cu testerul.', 'The EGR valve was stuck part-open with soot. Exhaust kept entering the intake, displacing fresh air: rough idle, smoke, hesitation. After replacement its position must be relearned with a scanner.'),
  home: T('Unii curăță supapa în loc s-o schimbe. După montaj, fără învățarea poziției, codul poate rămâne (o problemă cunoscută pe acest motor).', 'Some clean the valve instead of replacing it. Without a position relearn afterwards the code may stay (a known issue on this engine).'),
  fixed: T('Ralanti uniform, pleacă fără fum.', 'Smooth idle, pulls away without smoke.'), still: T('Tot neregulat și cu fum.', 'Still rough and smoky.') },

  road: [['scene', { sky: 'day' }], ['say', T('De luni de zile, numai 5 km până la serviciu și înapoi.', 'For months, just 5 km to work and back.')], ['btn', T('Pornește la drum', 'Set off')], ['start', 'start'], ['drive', 40, 1600], ['wait', 2500], ['dash', { eng: true }], ['say', T('Se aprinde martorul de motor, mașina intră în avarie. Ventilatorul a mers și ieri mult după ce ai oprit.', 'The engine light comes on and it goes into limp mode. Yesterday the fan ran long after you switched off.')], ['wait', 2000], ['btn', 'toGarage'], ['park']],
  drive: { txt: T('Mașina e în avarie, nu trage.', 'In limp mode, no power.') },
  obs: ob({ dpf: T('Nu se vede nimic din exterior.', 'Nothing visible from outside.'), dpfSensor: T('Furtunașele sunt întregi, conectate corect.', 'Small pipes intact, correctly connected.') }),
  cands: ['dpf', 'dpfSensor', 'egr', 'turbo', 'lambda', 'maf'], correct: ['dpf'],
  hints: [T('Gândește-te la felul în care e folosită mașina.', 'Think about how the car is used.'), T('Ce piesă din evacuare are nevoie de drumuri lungi ca să se curețe singură?', 'Which exhaust part needs long drives to clean itself?'), T('Presiunea diferențială e mare și realistă, deci senzorul pare că spune adevărul.', 'Differential pressure is high and plausible, so the sensor seems truthful.')],
  explain: T('Pe drumuri scurte, filtrul de particule nu atinge temperatura de regenerare, iar funinginea se adună până îl înfundă. Calculatorul a trecut în avarie ca să protejeze motorul. Pe Koleos 2.0 dCi e una dintre cele mai frecvente probleme. Uneori o regenerare forțată cu testerul ajunge; aici era prea plin.', 'On short trips the DPF never reaches regeneration temperature and soot builds until it clogs. The ECU went into limp mode to protect the engine. It\'s one of the most common Koleos 2.0 dCi problems. Sometimes a forced regeneration with a scanner is enough; here it was too full.'),
  home: T('O dată pe săptămână, 20–30 de minute pe drum deschis la turații medii ajută filtrul să se regenereze. Dacă ventilatorul merge des după oprire, poate a fost întreruptă o regenerare.', 'Once a week, 20–30 minutes on open road at medium revs helps the filter regenerate. A fan running often after switch-off may mean an interrupted regeneration.'),
  fixed: T('Fără avarie, presiunea diferențială e mică.', 'No limp mode, differential pressure low.'), still: T('Tot în avarie.', 'Still in limp mode.') },
{ id: 'k_dpfsens', sys: 'exhaust', diff: 2, conf: 'B', src: ['autohints'],

  sim: { ambient: 15, engT: 15 }, garage: { engT: 70 },

  live: { dpfP: T('180 mbar cu motorul oprit (imposibil)', '180 mbar with the engine off (impossible)'), soot: '40%' },
  road: [['scene', { sky: 'day' }], ['say', T('Mașina merge zilnic 80 km pe autostradă.', 'The car does 80 km of motorway daily.')], ['btn', T('Pornește la drum', 'Set off')], ['start', 'start'], ['drive', 90, 2200], ['wait', 3000], ['dash', { eng: true }], ['say', T('Apare martorul, mașina intră în avarie.', 'The warning comes on and it goes into limp mode.')], ['wait', 2000], ['btn', 'toGarage'], ['park']],
  drive: { txt: T('Intră în avarie după câțiva kilometri.', 'Limp mode after a few km.') },
  obs: ob({ dpfSensor: T('Senzorul și furtunașele par în regulă.', 'Sensor and pipes look fine.'), dpf: T('Nimic vizibil.', 'Nothing visible.') }),
  cands: ['dpfSensor', 'dpf', 'egr', 'lambda', 'turbo', 'maf'], correct: ['dpfSensor'],
  hints: [T('Mașina face exact drumurile de care are nevoie filtrul.', 'The car does exactly the drives the filter needs.'), T('Uită-te la valoarea presiunii diferențiale cu motorul OPRIT.', 'Look at the differential pressure with the engine OFF.'), T('Cu motorul oprit nu curge gaz, deci diferența ar trebui să fie zero.', 'With the engine off no gas flows, so the difference should be zero.')],
  explain: T('Senzorul de presiune diferențială raporta 180 mbar cu motorul oprit, ceea ce e imposibil. Calculatorul credea că filtrul e plin și a pus mașina în avarie, deși filtrul era bun. Schimbarea filtrului ar fi fost o cheltuială mare inutilă.', 'The differential pressure sensor reported 180 mbar with the engine off, which is impossible. The ECU thought the filter was full and went into limp mode, though the filter was fine. Replacing the filter would have been a big waste.'),
  home: T('Citește presiunea diferențială cu contactul pus și motorul oprit: trebuie să fie aproape 0. Verifică și furtunașele senzorului, uneori sunt inversate sau crăpate.', 'Read differential pressure with ignition on, engine off: it should be near 0. Check the sensor pipes too; sometimes they\'re swapped or cracked.'),
  fixed: T('Presiunea e 0 cu motorul oprit, fără martor.', 'Pressure 0 with engine off, no warning.'), still: T('Martorul FAP revine.', 'The DPF light returns.') },
{ id: 'k_lambda', sys: 'exhaust', diff: 2, conf: 'B', src: ['prLambda'], user: true,
  title: T('Consum mare și fără cruise control', 'High fuel use, no cruise control'), blurb: T('Consumul a crescut, apare „Verificați injecția” și nu mai poți activa pilotul automat. (Cazul tău.)', 'Fuel use is up, "Check injection" appears and cruise control won\'t engage. (Your case.)'),
  sim: { ambient: 15, engT: 15 }, garage: { engT: 70 },
  start: 'start', codes: [C('P0130', 'Sondă lambda – circuit / semnal', 'Lambda (O2) sensor circuit')],
  live: { o2: T('blocat la 21 % (ca aerul din atmosferă), nu se schimbă la accelerare', 'stuck at 21% (like outside air), doesn\'t change when accelerating') },
  road: [['scene', { sky: 'day' }], ['btn', T('Pornește la drum', 'Set off')], ['start', 'start'], ['drive', 90, 2200], ['wait', 2500], ['dash', { eng: true }], ['say', T('Pe bord: „Verificați injecția”. Încerci să pui pilotul automat: nu se activează. Calculatorul de bord arată un consum cu 1,5 l/100 km mai mare.', 'Dash: "Check injection". You try cruise control: it won\'t engage. The trip computer shows 1.5 L/100 km more than usual.')], ['wait', 2500], ['btn', 'toGarage'], ['park']],
  drive: { txt: T('Merge aproape normal, dar pilotul automat nu se activează și consumul e mare.', 'Drives almost normally, but cruise won\'t engage and fuel use is high.') },
  obs: ob({ lambda: T('Firul sondei e întreg; sonda e neagră de funingine.', 'The sensor wire is intact; the probe is black with soot.') }),
  cands: ['lambda', 'dpf', 'egr', 'maf', 'injectors', 'dpfSensor'], correct: ['lambda'],
  hints: [T('Pilotul automat se dezactivează când calculatorul are un defect de motor memorat.', 'Cruise control is disabled when the ECU has an engine fault stored.'), T('Una dintre valori din date live nu se schimbă deloc, orice ai face.', 'One live-data value doesn\'t change at all, whatever you do.'), T('Ce senzor măsoară oxigenul din gaze?', 'Which sensor measures oxygen in the exhaust?')],
  explain: T('Sonda lambda era moartă și raporta tot timpul oxigen ca în aerul din atmosferă. Calculatorul nu mai putea corecta dozajul și regenerările, deci consumul a crescut, iar defectul memorat a blocat pilotul automat. Pe un Koleos 2.0 dCi, schimbarea sondei a rezolvat exact mesajul „Injection à contrôler”.', 'The lambda probe was dead, always reporting oxygen like outside air. The ECU could no longer correct fuelling and regeneration, so fuel use rose, and the stored fault disabled cruise control. On a Koleos 2.0 dCi, replacing the probe fixed exactly the "Check injection" message.'),
  home: T('În date live, semnalul sondei trebuie să se schimbe când accelerezi și când iei piciorul de pe accelerație. Dacă stă fix, sonda sau firele ei sunt de vină. Se scoate cu o cheie specială, cu motorul cald (dar atenție la arsuri).', 'In live data the probe signal should change when you accelerate and lift off. If it\'s frozen, the probe or its wiring is at fault. Remove it with a dedicated socket, engine warm (beware of burns).'),
  fixed: T('Pilotul automat merge, consumul a revenit la normal.', 'Cruise works, fuel use back to normal.'), still: T('Pilotul automat tot nu se activează.', 'Cruise still won\'t engage.') },

  explain: T('Termostatul rămăsese blocat deschis. Lichidul mergea la radiator de la pornire, iar iarna aerul rece îl răcea prea mult. Motorul rece consumă mai mult, se uzează mai repede și încălzește prost habitaclul.', 'The thermostat was stuck open. Coolant went to the radiator from the start, and cold winter air over-cooled it. A cold engine burns more fuel, wears faster and heats the cabin poorly.'),

  hints: [T('Din mers aerul trece singur prin radiator. Pe loc, cine îl împinge?', 'On the move air flows through the radiator by itself. Standing still, what pushes it?'), T('Ventilatorul e comandat, dar se învârte?', 'The fan is commanded, but does it spin?'), T('Dacă primește 12 V și nu merge, problema e în el.', 'If it gets 12 V and doesn\'t run, the problem is inside it.')],

{ id: 'k_dmf', sys: 'driveline', diff: 2, conf: 'B', src: ['autohints', 'fiches'],
  title: T('Bubuit la oprire', 'Clunk at switch-off'), blurb: T('Când oprești motorul se aude un bubuit metalic. La ralanti vibrează, iar la plecare în treapta 1 smucește.', 'A metallic clunk when you switch off. It vibrates at idle and judders pulling away in first.'),

  start: 'start', codes: [],
  road: [['scene', { sky: 'day' }], ['btn', T('Pornește la drum', 'Set off')], ['start', 'start'], ['sfx', 'rattle', 2], ['say', T('La ralanti se simte o vibrație în pedale și se aude un zdrăngănit care dispare când apeși ambreiajul.', 'At idle there\'s vibration in the pedals and a rattle that disappears when you press the clutch.')], ['drive', 30, 1300], ['say', T('La plecare în treapta 1 mașina smucește.', 'Pulling away in first it judders.')], ['wait', 2500], ['park'], ['sfx', 'clunk', 0.5], ['say', T('Când oprești motorul: un bubuit metalic.', 'Switching off: a metallic clunk.')], ['btn', 'toGarage']],
  listen: T('Zdrăngănit metalic din zona clopotului cutiei la ralanti; dispare cu ambreiajul apăsat.', 'Metallic rattle from the bellhousing at idle; goes away with the clutch pressed.'), listenSfx: 'rattle',
  lift: T('Prin fanta de control a clopotului: masa secundară a volantului are joc mare când o rotești cu o rangă.', 'Through the bellhousing inspection hole: the flywheel\'s secondary mass has a lot of play when levered.'),
  obs: ob({ engineMount: T('Tamponul e întreg.', 'The mount is intact.'), gearbox: T('Fără scurgeri.', 'No leaks.') }),
  cands: ['flywheel', 'clutch', 'engineMount', 'gearbox', 'crankPulley', 'starter'], correct: ['flywheel'],
  hints: [T('Zgomotul dispare când apeși ambreiajul. Ce se decuplează atunci?', 'The noise goes when you press the clutch. What disconnects then?'), T('Gândește-te ce piesă absoarbe vibrațiile unui diesel înainte să ajungă la cutie.', 'Think which part soaks up diesel vibration before it reaches the gearbox.'), T('Bubuitul la oprire e clasic pentru această piesă.', 'A clunk at switch-off is classic for this part.')],
  explain: T('Volantul cu masă dublă avea arcurile interne uzate: masa secundară avea joc mare, de aici zdrăngănitul, vibrațiile și bubuitul la oprire. Cuplul mare al diesel-ului (mai ales după chip-tuning) îl uzează mai repede. De obicei se schimbă împreună cu kitul de ambreiaj.', 'The dual-mass flywheel\'s internal springs were worn: the secondary mass had lots of play, hence the rattle, vibration and clunk. A diesel\'s high torque (especially after a remap) wears it faster. It\'s usually replaced together with the clutch kit.'),
  home: T('Simptome clasice: bubuit la oprire, zdrăngănit la ralanti care dispare cu ambreiajul apăsat. Schimbarea cere scoaterea cutiei: e o lucrare de atelier.', 'Classic signs: clunk at switch-off, idle rattle that stops with the clutch pressed. Replacing it means removing the gearbox: a workshop job.'),
  fixed: T('Fără zdrăngănit, fără bubuit la oprire.', 'No rattle, no clunk at switch-off.'), still: T('Zdrăngănitul și bubuitul au rămas.', 'The rattle and clunk remain.') },
{ id: 'k_clutch', sys: 'driveline', diff: 2, conf: 'B', src: ['autohints'],
  title: T('Țiuie la ambreiaj', 'Whine at the clutch'), blurb: T('Cu pedala de ambreiaj apăsată se aude un țiuit/scârțâit care dispare când o eliberezi. Pedala vibrează puțin.', 'With the clutch pedal pressed there\'s a whine/squeal that goes away when released. The pedal vibrates slightly.'),
  sim: { ambient: 15, engT: 15 }, garage: { engT: 60 },
  start: 'start', codes: [],
  road: [['scene', { sky: 'day' }], ['btn', T('Pornește la drum', 'Set off')], ['start', 'start'], ['say', T('Apeși ambreiajul să bagi în treapta 1.', 'You press the clutch to select first.')], ['sfx', 'squeal', 2.5], ['say', T('Cât ții pedala apăsată se aude un țiuit. Când o eliberezi, dispare.', 'While the pedal is down there\'s a whine. Release it and it stops.')], ['drive', 40, 1500], ['wait', 2000], ['btn', 'toGarage'], ['park']],
  listen: T('Cu pedala apăsată: țiuit din clopotul cutiei. Eliberată: liniște.', 'Pedal down: whine from the bellhousing. Released: quiet.'), listenSfx: 'squeal',
  obs: ob({ gearbox: T('Fără scurgeri de ulei.', 'No oil leaks.') }),
  cands: ['clutch', 'flywheel', 'gearbox', 'engineMount', 'belt', 'starter'], correct: ['clutch'],
  hints: [T('Zgomotul apare doar când apeși pedala. Ce piesă lucrează doar atunci?', 'The noise only appears with the pedal pressed. Which part only works then?'), T('E o piesă care se rotește și apasă pe arcul plăcii de presiune.', 'It\'s a spinning part that presses on the cover spring.'), T('Face parte din kitul de ambreiaj.', 'It\'s part of the clutch kit.')],
  explain: T('Rulmentul de presiune era uzat. El lucrează doar când apeși pedala, apăsând pe arcul plăcii, de aceea zgomotul apărea numai atunci. Se schimbă cu tot kitul de ambreiaj, iar volantul se verifică la ocazie.', 'The release bearing was worn. It only works when you press the pedal, pushing on the cover spring, so the noise only appeared then. It\'s replaced with the whole clutch kit, and the flywheel is checked while you\'re there.'),
  home: T('Zgomot doar cu pedala apăsată = rulment de presiune. Zgomot cu pedala liberă, care dispare la apăsare = rulment din cutie sau volant.', 'Noise only with the pedal pressed = release bearing. Noise with the pedal up that stops when pressed = gearbox bearing or flywheel.'),
  fixed: T('Pedala apăsată, liniște.', 'Pedal down, silence.'), still: T('Tot țiuie la apăsarea pedalei.', 'Still whines with the pedal down.') },

  explain: T('Diferențialul spate al versiunii 4x4 a cedat intern: dinți și rulmenți distruși, bucăți metalice în ulei, scurgeri la planetare. E o problemă documentată la Koleos 2.0 dCi 4x4, de obicei între 80.000 și 100.000 km.', 'The 4x4\'s rear differential failed internally: broken teeth and bearings, metal chunks in the oil, leaks at the half-shafts. It\'s a documented Koleos 2.0 dCi 4x4 issue, usually between 80,000 and 100,000 km.'),

  cands: ['throttle', 'vacHose', 'mapSensor', 'ectSensor', 'sparkPlugs', 'injectors'], correct: ['throttle'],
  hints: [T('Problema e doar la ralanti, cald.', 'Only at hot idle.'), T('Cine ține ralantiul pe acest motor?', 'What holds idle on this engine?'), T('Calamina strâmtează trecerea aerului la deschideri mici.', 'Carbon narrows the air path at small openings.')],

  fixed: T('Ralanti stabil la 800 rpm.', 'Stable 800 rpm idle.'), still: T('Tot se oprește la semafor.', 'Still stalls at lights.') },

  hints: [T('Bujiile ies ude: benzina ajunge, chiar prea multă.', 'The plugs come out wet: fuel arrives, too much.'), T('De ce ar injecta calculatorul atât de mult la cald?', 'Why would the ECU inject so much when hot?'), T('Ce crede el despre temperatura motorului?', 'What does it think the engine temperature is?')],

function doCharge() { sim.booster = false; sim.soc = 1; sim.engT = sim.ambient; readout(t('charge'), h('div', {}, L(T('Bateria a stat 6 ore la încărcător. Arată 100%.', 'The battery spent 6 hours on the charger. It reads 100%.')))); renderTools(); }
function doHint() { const s = G.scn; if (G.hintsUsed >= s.hints.length) { readout(t('hintT'), h('div', {}, t('noHints'))); return; } const hh = s.hints[G.hintsUsed]; G.hintsUsed++; G.score = Math.max(0, G.score - 10); updateTop(); readout(`${t('hintT')} ${G.hintsUsed}/${s.hints.length}`, h('div', {}, L(hh)), 'hint', '−10'); renderTools(); }

/* ---------- indicații automate ---------- */
const NUDGE = {
  chatter: T('Clic-clic rapid apare de obicei când solenoidul primește prea puțină tensiune: se închide, tensiunea cade, se deschide. Poate are legătură cu voltajul?', 'Rapid clicking usually means the solenoid gets too little voltage: it closes, voltage drops, it opens. Maybe it\'s voltage?'),
  dead: T('Nimic deloc… Ajunge curent măcar la bord? Poate are legătură cu bateria sau bornele.', 'Nothing at all… Is current even reaching the dash? Maybe the battery or terminals.'),
  slow: T('Demarorul se învârte, dar greu. Ori nu primește destul curent, ori motorul e greu de rotit.', 'The starter turns, but slowly. Either too little current, or the engine is hard to turn.'),
  slowCharged: T('Bateria e încărcată și totuși nu are forță la frig. Încărcată nu înseamnă sănătoasă.', 'The battery is charged yet weak in the cold. Charged doesn\'t mean healthy.'),
  click: T('Un singur clic și bordul nu scade deloc. O baterie slabă ar face luminile să scadă. Curentul mare pare că nici nu pleacă spre demaror.', 'A single click and the dash doesn\'t dim. A weak battery would dim the lights. The big current never seems to leave for the starter.'),
  crankNoStart: T('Demarorul învârte bine, deci bateria și demarorul își fac treaba. Problema e la ce îi trebuie motorului ca să ardă: motorină, presiune, semnale.', 'The starter turns well, so battery and starter are fine. The problem is what the engine needs to fire: fuel, pressure, signals.'),
  startLong: T('Învârte mult până prinde. Ceva îi lipsește motorului la început: căldură, motorină sau presiune.', 'Long crank before it catches. Something is missing at first: heat, fuel or pressure.'),
  boosterStart: T('Cu booster pornește. Deci demarorul și motorul pot face treaba; problema pare la sursa de curent.', 'It starts with the jump pack. So the starter and engine can do it; the problem looks like the power source.'),
  coldStarts: T('Rece a pornit, cald doar clic. Ce piesă se poartă diferit cu temperatura?', 'Started cold, only clicks hot. Which part behaves differently with temperature?'),
  restLow: T('Sub aprox. 12,2 V în repaus bateria e descărcată. De ce s-a descărcat?', 'Under about 12.2 V at rest the battery is flat. Why?'),
  restOk: T('Bateria pare plină. Tensiunea în repaus nu spune însă cât curent dă la pornire.', 'The battery looks full. Resting voltage doesn\'t show cranking power, though.'),
  runLow: T('Cu motorul pornit ar trebui să fie peste aprox. 13,5 V. Ceva nu încarcă.', 'Running it should be above about 13.5 V. Something isn\'t charging.'),
  runOk: T('Încărcarea arată bine.', 'Charging looks good.'),
  crankLow: T('La pornire bateria n-ar trebui să scadă sub aprox. 9,6 V.', 'While cranking the battery shouldn\'t drop below about 9.6 V.'),
  sOkOut0: T('Comanda ajunge la solenoid, dar din el nu iese nimic spre demaror.', 'The command reaches the solenoid, but nothing comes out to the starter.'),
  obd562: T('P0562 înseamnă tensiune scăzută. Codul spune ce a văzut calculatorul, nu ce piesă e de vină.', 'P0562 means low voltage. A code says what the ECU saw, not which part is to blame.'),
  obdCode: T('Codul arată unde să cauți, nu ce piesă să schimbi. Compară în date live valoarea cerută cu cea reală.', 'A code shows where to look, not what to replace. Compare target and actual values in live data.'),
  obdNone: T('Niciun cod. Multe defecte mecanice nu lasă cod: ascultă, privește, măsoară.', 'No codes. Many mechanical faults leave none: listen, look, measure.'),
  weakBat: T('Starea bateriei e slabă. O încărcare îi crește tensiunea, nu și puterea la pornire.', 'Battery health is poor. Charging raises voltage, not cranking power.'),
  lowSoc: T('Bateria e sănătoasă, doar descărcată. Contează de ce.', 'The battery is healthy, just flat. Why matters.'),
  goodBat: T('Bateria e bună. Caută mai departe.', 'The battery is good. Look further.')
};
function nudge(key, txt) { if (!G.nudges || !G.scn || G.lesson) return; if (G.seen.has(key)) return; G.seen.add(key); readout('💭 ' + t('thought'), h('div', {}, L(txt)), 'think'); }
function nudgeAttempt(r) {
  if (r.kind === 'click' && sim.engT > 55) G.sawHotClick = true;
  const m = { chatter: 'chatter', dead: 'dead', click: 'click', crankNoStart: 'crankNoStart', startLong: 'startLong' }[r.kind];
  if (r.kind === 'slow') (sim.soc > 0.9 && sim.health < 0.6) ? nudge('slowCharged', NUDGE.slowCharged) : nudge('slow', NUDGE.slow);
  else if (m) nudge(m, NUDGE[m]);
  else if (r.kind === 'start') { if (sim.booster) nudge('boosterStart', NUDGE.boosterStart); else if (G.sawHotClick && sim.engT < 40) nudge('coldStarts', NUDGE.coldStarts); }
}
function nudgeRest(v) { v < 12.2 ? nudge('restLow', NUDGE.restLow) : (v >= 12.45 && nudge('restOk', NUDGE.restOk)); }
function nudgeRun(v) { v < 13.5 ? nudge('runLow', NUDGE.runLow) : nudge('runOk', NUDGE.runOk); }
function nudgeMeter(k, r) { if (k === 'batCrank' && r.vmin < 9.6) nudge('crankLow', NUDGE.crankLow); if (k === 'solOut' && r.vOut === 0 && r.vS > 10) nudge('sOkOut0', NUDGE.sOkOut0); nudgeAttempt(r); }

/* ---------- informații piesă ---------- */
let hoverId = null, downAt = null; const canvas = $('#c3d');
canvas.addEventListener('pointermove', ev => { if (G.screen !== 'garage') return; const id = sc.pickAt(ev); hoverId = id; const tip = $('#tip'); if (id && ev.pointerType === 'mouse') { tip.style.display = 'block'; tip.textContent = L(PARTS[id].name); const r = canvas.getBoundingClientRect(); tip.style.left = (ev.clientX - r.left + 14) + 'px'; tip.style.top = (ev.clientY - r.top + 10) + 'px'; } else tip.style.display = 'none'; if (!G.lesson) sc.setHighlight(id ? [id] : [], 0x3366cc); });
let pressTimer = null;
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); if (G.screen !== 'garage') return; const id = sc.pickAt(ev); if (id) freeRemove(id); });
canvas.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; clearTimeout(pressTimer); if (ev.pointerType === 'touch') { const e0 = { clientX: ev.clientX, clientY: ev.clientY }; pressTimer = setTimeout(() => { if (!downAt) return; const id = sc.pickAt(e0); if (id) { freeRemove(id); downAt = null; } }, 600); } });
canvas.addEventListener('pointermove', ev => { if (downAt && Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 8) clearTimeout(pressTimer); });
canvas.addEventListener('pointerleave', () => { $('#tip').style.display = 'none'; if (!G.lesson) sc.setHighlight([], 0); });
canvas.addEventListener('pointerup', ev => { clearTimeout(pressTimer); if (!downAt) return; const d = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]); downAt = null; if (d > 6) return; const id = sc.pickAt(ev); if (id) onPartClick(id); });
function onPartClick(id) { if (G.repair && G.repair.phase === 'remove') { tryRemove(id); return; } if (G.freeMode && !G.lesson && !G.repair) { freeRemove(id); return; } showInfo(id); }
function freeRemove(id) { if (!G.scn || G.lesson) return; if (G.repair) { if (G.repair.phase === 'remove') tryRemove(id); return; } const p = PARTS[id]; if (!p.removable) { showInfo(id); return; } if (p.state !== 'in') return; if (sim.running) stopEngine(true);
  const missing = p.pre.filter(q => PARTS[q].state === 'in'); if (missing.length) { readout(L(p.name), h('div', {}, `${t('blocked')} `, h('b', {}, missing.map(q => L(PARTS[q].name)).join(', '))), 'bad'); return; }
  p.state = p.bench ? 'bench' : 'out'; G.freeStack.push(id); sc.syncPart(id); audio.ok() && audio.click(audio.now() + 0.02, 0.35); readout(`${t('removed')}: ${L(p.name)}`, [h('div', { class: 'q' }, `${t('tool')}: ${L(p.tool)}`), (G.scn.obs && G.scn.obs[id] && !G.fixed) ? h('div', { style: 'margin-top:4px' }, h('b', {}, t('see') + ': '), L(G.scn.obs[id])) : null]); renderWarn(); }
function freeRefit(all) { do { const id = G.freeStack.pop(); if (!id) break; PARTS[id].state = 'in'; sc.syncPart(id, all ? 350 : 650); } while (all && G.freeStack.length); audio.ok() && audio.click(audio.now() + 0.02, 0.3); renderWarn(); }
function partsOut() { return Object.values(PARTS).some(p => p.state && p.state !== 'in'); }
function renderWarn() { const w = $('#warn'); const n = G.freeStack.length; w.classList.toggle('on', n > 0 && !G.lesson); w.innerHTML = ''; if (!n) return; w.append(h('b', {}, '⚠ ' + t('warnOut')), h('span', { class: 'q' }, `${t('removedN')}: ${n}`), h('button', { class: 'small', on: { click: () => freeRefit(false) } }, `${t('putLast')}: ${L(PARTS[G.freeStack[n - 1]].name)}`), h('button', { class: 'small primary', on: { click: () => freeRefit(true) } }, t('putAll'))); }
function blockIfOut() { if (!partsOut()) return false; readout(t('tryStart'), h('div', {}, t('partsOutBlock')), 'bad'); return true; }
function showInfo(id) { const p = PARTS[id]; const obs = G.scn && !G.fixed && G.scn.obs && G.scn.obs[id]; readout(L(p.name), [h('div', {}, L(p.desc)), (G.scn && !G.lesson && p.removable) ? h('div', { style: 'margin-top:6px' }, h('b', {}, t('see') + ': '), obs ? L(obs) : t('nothing')) : null]); }

/* ================= REPARAȚIE ================= */
function openDiagnose() { let sel = null; modal(box => { box.append(h('h2', {}, t('diagT')), h('p', { class: 'q' }, t('diagP'))); const opts = h('div', { class: 'opts' }); const go = h('button', { class: 'primary', disabled: true, on: { click: () => { closeModal(); startRepair(sel); } } }, t('doReplace'));
  G.scn.cands.forEach(id => { const b = h('button', { on: { click: () => { sel = id; opts.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); go.disabled = false; } } }, L(PARTS[id].name)); opts.append(b); });
  box.append(opts, h('div', { class: 'btns' }, h('button', { on: { click: closeModal } }, t('cancel')), go)); }); }
function startRepair(target) { if (sim.running) stopEngine(); sim.booster = false; G.repair = { target, stack: G.freeStack.slice(), phase: PARTS[target].state !== 'in' ? 'install' : 'remove' }; G.freeStack = []; renderWarn();
  if (G.repair.phase === 'install') { const st = G.repair.stack; st.splice(st.indexOf(target), 1); st.push(target); } renderTools(); readout(t('gRepair'), [h('div', {}, h('b', {}, `${t('repTarget')}: ${L(PARTS[target].name)}`)), h('div', { class: 'q' }, t('repHelp'))]); }
function renderRepairTools(Tt) { const R = G.repair; Tt.append(h('h4', {}, t('gRepair')), h('div', { style: 'font-size:14px' }, `${t('repTarget')}: `, h('b', {}, L(PARTS[R.target].name))));
  if (R.phase === 'remove') { Tt.append(h('div', { style: 'font-size:13px;color:var(--quiet)' }, t('repHelp'))); if (R.stack.length) Tt.append(h('div', { style: 'font-size:13px;color:var(--quiet)' }, R.stack.map((id, i) => h('div', {}, `${i + 1}. ${L(PARTS[id].name)}`)))); }
  if (R.phase === 'install') { const top = R.stack[R.stack.length - 1]; Tt.append(h('button', { class: 'primary', on: { click: installNext } }, top === R.target ? `${t('installNew')}: ${L(PARTS[top].name)}` : `${t('installBack')}: ${L(PARTS[top].name)}`)); }
  Tt.append(h('button', { style: 'margin-top:10px', on: { click: abortRepair } }, t('abortRepair'))); }
function tryRemove(id) { const p = PARTS[id], R = G.repair; if (!p.removable) { showInfo(id); return; } if (p.state !== 'in') return;
  const missing = p.pre.filter(q => PARTS[q].state === 'in'); if (missing.length) { readout(L(p.name), h('div', {}, `${t('blocked')} `, h('b', {}, missing.map(q => L(PARTS[q].name)).join(', '))), 'bad'); return; }
  p.state = p.bench ? 'bench' : 'out'; R.stack.push(id); sc.syncPart(id); audio.ok() && audio.click(audio.now() + 0.02, 0.35);
  readout(`${t('removed')}: ${L(p.name)}`, h('div', { class: 'q' }, `${t('tool')}: ${L(p.tool)}`)); if (id === R.target) R.phase = 'install'; renderTools(); }
function installNext() { const R = G.repair; const id = R.stack.pop(); PARTS[id].state = 'in'; sc.syncPart(id); audio.ok() && audio.click(audio.now() + 0.02, 0.3); if (!R.stack.length) { finishRepair(); return; } renderTools(); }
function abortRepair() { const R = G.repair; while (R.stack.length) { const id = R.stack.pop(); PARTS[id].state = 'in'; sc.syncPart(id, 300); } G.repair = null; renderTools(); renderWarn(); }
function applyReplacement(id) { const s = G.scn; if (id === 'battery') { sim.health = 1; sim.soc = 0.95; } if (id === 'alternator') sim.faults.delete('alternator'); if (id === 'solenoid' || id === 'starter') sim.faults.delete('solenoid'); if (id === 'starter') sim.faults.delete('starterMotor'); if (id === 'groundStrap') sim.faults.delete('ground'); if (id === 'battery') sim.faults.delete('battery'); if (!s.elec && s.correct.includes(id)) G.fixed = true; }
async function finishRepair() { const target = G.repair.target, s = G.scn; G.repair = null; applyReplacement(target); renderTools(); await sleep(700); if (G.scn !== s || G.screen !== 'garage') return; runTest(target); }

const ELEC_TESTS = {
  frost: async T_ => { T_.say(T('Noaptea trece. Dimineață, −10 °C.', 'The night passes. Morning, −10 °C.')); sim.running = false; sim.booster = false; sim.engT = -10; if (sim.health > 0.9) sim.soc = 0.95; await sleep(1200); const r = sim.attempt(G.scn, G.fixed); await T_.attempt(r); return r.kind === 'start'; },
  alt: async T_ => { sim.running = false; sim.booster = false; sim.engT = 15; sim.soc = Math.max(sim.soc, 0.9); T_.say(T('Bateria a fost încărcată. Drum de test de 30 de minute.', 'The battery was charged. 30-minute test drive.')); await sleep(1200); const r = sim.attempt(G.scn, G.fixed); await T_.attempt(r); if (r.kind !== 'start') return false; await sleep(1500);
    if (sim.faults.has('alternator')) { T_.say(T(`După 15 minute se aprinde martorul bateriei. ${fmt(12.2)} V și scade.`, `After 15 minutes the battery light comes on. ${fmt(12.2)} V and falling.`)); stopEngine(); return false; }
    T_.say(T(`Martorul e stins, ${fmt(14.1)} V tot drumul.`, `Light off, ${fmt(14.1)} V all the way.`)); await sleep(1200); stopEngine(); return true; },
  sol: async T_ => { sim.running = false; sim.booster = false; sim.engT = 8; sim.soc = Math.max(sim.soc, 0.9); T_.say(T('Test: pornire la rece, 30 km, oprire și repornire la cald.', 'Test: cold start, 30 km, stop and hot restart.')); await sleep(1200); let r = sim.attempt(G.scn, G.fixed); await T_.attempt(r); if (r.kind !== 'start') return false;
    await sleep(1200); sim.engT = 88; T_.say(T('Motorul e cald. Oprești.', 'Engine hot. You switch off.')); stopEngine(); await sleep(1400); r = sim.attempt(G.scn, G.fixed); await T_.attempt(r); if (r.kind === 'start') { await sleep(800); stopEngine(); } return r.kind === 'start'; }
};
async function runTest(target) {
  const s = G.scn; let lines;
  modal(box => { box.append(h('h2', {}, t('testT'))); lines = h('div', {}); box.append(lines); });
  const T_ = { say: txt => lines.append(h('p', {}, L(txt))), attempt: async r => { T_.say(ATTEMPT_TXT[r.kind]); await animateAttempt(r); } };
  let ok = false;
  try {
    if (s.elec) ok = await ELEC_TESTS[s.test](T_);
    else {
      sim.running = false; sim.booster = false; sim.engT = s.testCold ? sim.ambient : 88;
      T_.say(T('Pornești și faci un drum de test.', 'You start up and take a test drive.')); await sleep(900);
      const r = sim.attempt(s, G.fixed); await T_.attempt(r); await sleep(900);
      ok = G.fixed; if (ok) audio.setRpm(1800); else if (s.drive && s.drive.sfx) audio.sfx(s.drive.sfx, 2);
      T_.say(ok ? (s.fixed || T('Simptomele au dispărut.', 'The symptoms are gone.')) : (s.still || T('Simptomul a revenit.', 'The symptom is back.')));
      await sleep(1500); stopEngine();
    }
  } catch (e) { console.error(e); }
  await sleep(500); const box = $('#modalBox');
  if (!ok) { G.wrong++; G.score = Math.max(0, G.score - 25); updateTop(); box.append(h('h2', { style: 'color:var(--bad);margin-top:12px' }, t('failT')), h('p', {}, t('failP')), h('div', { class: 'btns' }, h('button', { class: 'primary', on: { click: () => { closeModal(); renderTools(); } } }, t('backDiag')))); renderTools(); return; }
  let extra = null; if (s.partial && s.partial[target]) { G.score = Math.max(0, G.score - s.partial[target].pts); extra = L(s.partial[target].txt); }
  updateTop(); try { if (G.best[s.id] == null || G.score > G.best[s.id]) { G.best[s.id] = G.score; localStorage.setItem('ma_best', JSON.stringify(G.best)); } } catch (e) {}
  const next = G.idx + 1 < G.car.scen.length ? G.idx + 1 : null;
  const src = (s.src || []).map(k => SRC_LINKS[k]).filter(Boolean);
  box.append(...[h('h2', { style: 'color:var(--good);margin-top:12px' }, `${t('okT')} ${t('score')}: ${G.score}`), extra ? h('p', {}, extra) : null,
    h('div', { class: 'sec' }, t('whatT')), h('p', {}, L(s.explain)), h('div', { class: 'sec' }, t('homeT')), h('p', {}, L(s.home)),
    h('div', { class: 'sec' }, t('srcT')), h('p', { class: 'q' }, t('conf_' + s.conf), s.user ? (I18N.lang === 'ro' ? ' · cazul tău real' : ' · your real case') : ''), src.length ? h('ul', { class: 'src' }, src.map(x => h('li', {}, h('a', { href: x.u, target: '_blank', rel: 'noopener' }, x.t)))) : null,
    h('div', { class: 'btns' }, h('button', { on: { click: goMenu } }, t('menu')), next != null ? h('button', { class: 'primary', on: { click: () => { closeModal(); startScenario(next); } } }, t('nextLevel')) : null)].filter(Boolean));
}

/* ================= LECȚIA ================= */
function startLesson(id) { const def = LESSONS.find(l => l.id === id) || LESSONS[0]; useCar(CARS.find(c => c.id === def.car)); G.scn = null; G.lesson = { i: 0, def, steps: def.steps }; sc.resetParts(); sc.setXray(false); show('garage'); $('#tools').style.display = 'none'; $('#readout').innerHTML = ''; sc.openHoodNow(); sc.setView('def'); renderViewbar(); $('#lesson').style.display = 'block'; lessonStep(0); }
function lessonStep(i) {
  const st = G.lesson.steps[i]; Object.assign(G.lesson, { i, rpm: st.rpm || 0, pinion: st.pinion || 0, glow: !!st.glow });
  sc.setFocus(st.hl);
  if (st.sound === 'crank') { audio.stopIdle(true); if (audio.ok()) audio.crank(audio.now() + 0.05, 2.2, 1); }
  else if (st.sound === 'idle') audio.startIdle(900);
  else if (!st.rpm) audio.stopIdle(true);
  if (st.sound === 'click' && audio.ok()) audio.click(audio.now() + 0.05, 1);
  if (st.view) sc.setView(st.view);
  renderLesson();
}
function renderLesson() {
  const i = G.lesson.i, st = G.lesson.steps[i], N = G.lesson.steps.length;
  $('#lsN').textContent = `${t('step')} ${i + 1}/${N}`; $('#lsT').textContent = L(st.t);
  const B = $('#lsB'); B.innerHTML = ''; L(st.b).split('\n').forEach(p => B.append(h('p', {}, p)));
  B.append(h('div', { class: 'focus' }, h('b', {}, t('inFocus') + ': '), st.hl.filter(id => PARTS[id]).map(id => L(PARTS[id].name)).join(', ')));
  const b = $('#lsBtns'); b.innerHTML = '';
  b.append(h('button', { disabled: i === 0, on: { click: () => lessonStep(i - 1) } }, t('prev')), h('button', { on: { click: () => lessonStep(i) } }, t('replay')),
    i < N - 1 ? h('button', { class: 'primary', on: { click: () => lessonStep(i + 1) } }, t('next')) : h('button', { class: 'primary', on: { click: endLesson } }, t('finish')));
}
function endLesson() { audio.stopIdle(); sc.setFocus(null); goMenu(); }

/* ================= BUCLĂ ================= */
let last = performance.now();
function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.screen === 'road') drawRoad(dt);
  if (G.screen !== 'garage' || !sc) return;
  let rpm = 0, pinion = false, glow = false;
  if (G.lesson) { rpm = G.lesson.rpm; pinion = !!G.lesson.pinion; glow = G.lesson.glow; }
  else if (G.crankAnim) { rpm = G.crankAnim === 2 ? 60 : 200; pinion = true; }
  else if (sim.running) rpm = sim.idleRpm();
  sc.update(dt, { rpm, pinion, glow, fan: sim.running && sim.engT > 98 && !(G.scn && G.scn.fanDead && !G.fixed) });
}
window.addEventListener('resize', () => { if (sc) sc.resize(); resizeRoad(); });
renderMenu(); updateTop(); resizeRoad(); requestAnimationFrame(loop);
window.__booted = true; document.getElementById('fallback').style.display = 'none';
window.__game = { useCar, freeRemove, freeRefit, partsOut, G, sim, get PARTS() { return PARTS; }, get sc() { return sc; }, CARS, startScenario, enterGarage, startLesson, lessonStep, openDiagnose, startRepair, tryRemove, installNext, doMeter, doOBD, doBatTest, doCharge, doCool, doAttempt, doHint, doTool, doDrive };

return { registerScenarios };
})();
</script>
